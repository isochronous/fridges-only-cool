title: "No Magic Fridges"
description: "A powered fridge becomes an insulated box with a thermostat: it only ever cools, its contents share heat with each other, and food already colder than the 1 °C target is never warmed up to it. Keep a fridge in a freezer room, power it whenever you like, and your deep-frozen food stays deep-frozen."
staticID: "Isochronous.NoMagicFridges"
