title: "No Magic Fridges"
description: "Changes what a fridge does to its contents while it is powered. Vanilla pulls everything to 1 °C, which also heats frozen food. With this mod a powered fridge is an insulated box with a thermostat: it cools what is warmer than 1 °C, never heats what is colder, lets the contents share heat with each other, and insulates cold food from the room. Unpowered fridges are unchanged."
staticID: "Isochronous.NoMagicFridges"
